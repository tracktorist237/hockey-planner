name: Deploy Frontend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Require separate operator activation for exact source
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HP93_APPROVED_HEAD: ${{ vars.HP93_APPROVED_HEAD }}
        run: test -n "$HP93_APPROVED_HEAD" && test "$HP93_APPROVED_HEAD" = "$EXPECTED_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy frontend staging under shared admission protocol
        env:
          EXPECTED_SHA: ${{ github.sha }}
          HP93_APPROVED_HEAD: ${{ vars.HP93_APPROVED_HEAD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: python scripts/quality/deploy_frontend_ssh.py --expected-sha "$EXPECTED_SHA"
  smoke:
    name: Frontend post-deploy staging verification
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'tracktorist237/hockey-planner'
    environment: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tracktorist237/HockeyPlanner.Backend
          ref: develop
          fetch-depth: 0
          path: .quality-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TEST INFRA - install read-only browser smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify deployed frontend and staging environment
        env:
          EXPECTED_SHA: ${{ github.sha }}
          STAGING_DIAGNOSTIC_HOST: ${{ secrets.STAGING_DIAGNOSTIC_HOST }}
          STAGING_DIAGNOSTIC_KEY: ${{ secrets.STAGING_DIAGNOSTIC_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: python .quality-backend/scripts/staging/smoke.py --kind frontend --expected "$EXPECTED_SHA" --backend-repo .quality-backend --frontend-repo . --output staging-smoke
      - name: Sanitized HTTP and wrapper diagnostics
        if: always() && hashFiles('staging-smoke/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging-summary
          path: staging-smoke/summary.json
          retention-days: 7
      - name: Sanitized browser failure diagnostics
        if: always() && hashFiles('staging-smoke/browser/sanitized.ok') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging-browser
          path: staging-smoke/browser/
          retention-days: 7
