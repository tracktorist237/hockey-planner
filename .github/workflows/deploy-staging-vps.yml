name: Deploy Frontend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend staging on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/hockeyplanner-staging/frontend-src
            EXPECTED_SHA="${{ github.sha }}"
            git fetch origin develop
            test "$(git rev-parse "$EXPECTED_SHA^{commit}")" = "$EXPECTED_SHA"
            # version:sync modifies tracked manifests. Build an immutable export,
            # preserving the existing VPS checkout and its generated local changes.
            BUILD_DIR="$(mktemp -d /opt/hockeyplanner-staging/frontend-build.XXXXXXXX)"
            trap 'rm -rf -- "$BUILD_DIR"' EXIT
            git archive "$EXPECTED_SHA" | tar -x -C "$BUILD_DIR"
            cd "$BUILD_DIR"
            npm ci
            npm run version:sync
            APP_VERSION="$(cat VERSION | tr -d '[:space:]')"
            APP_BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            REACT_APP_API_BASE=/api REACT_APP_VERSION="$APP_VERSION" REACT_APP_BUILD_TIME="$APP_BUILD_TIME" npm run build
            rm -rf /opt/hockeyplanner-staging/frontend/build
            cp -r "$BUILD_DIR/build" /opt/hockeyplanner-staging/frontend/build
            cd /opt/hockeyplanner
            docker compose restart nginx
            docker compose ps
