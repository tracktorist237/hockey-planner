name: Deploy Frontend Staging to VPS

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  deploy:
    needs: validation
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend staging on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/hockeyplanner-staging/frontend-src
            EXPECTED_SHA="${{ github.sha }}"
            test -z "$(git status --porcelain)"
            git fetch origin develop
            git merge --ff-only "$EXPECTED_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            npm ci
            npm run version:sync
            APP_VERSION="$(cat VERSION | tr -d '[:space:]')"
            APP_BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            REACT_APP_API_BASE=/api REACT_APP_VERSION="$APP_VERSION" REACT_APP_BUILD_TIME="$APP_BUILD_TIME" npm run build
            rm -rf /opt/hockeyplanner-staging/frontend/build
            cp -r /opt/hockeyplanner-staging/frontend-src/build /opt/hockeyplanner-staging/frontend/build
            cd /opt/hockeyplanner
            docker compose restart nginx
            docker compose ps
