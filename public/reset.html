<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Hockey Planner Reset</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: grid;
      gap: 14px;
      padding: 22px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 18px;
      background: #111827;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.45;
    }

    a {
      display: block;
      border-radius: 14px;
      padding: 13px 16px;
      background: #2563eb;
      color: #fff;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Очищаем Hockey Planner</h1>
    <p>Удаляем локальные данные, кэш приложения и старый service worker.</p>
    <p>Если переход не произошёл автоматически, нажмите кнопку ниже.</p>
    <a id="go" href="/login?reset=manual">Перейти ко входу</a>
  </main>

  <script>
    (function () {
      var next = "/login?reset=" + Date.now();

      function go() {
        location.replace(next);
      }

      try {
        document.getElementById("go").href = next;
      } catch (e) {}

      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}

      try {
        if ("caches" in window) {
          caches.keys()
            .then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return caches.delete(key);
              }));
            })
            .catch(function () {});
        }
      } catch (e) {}

      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
            .catch(function () {});
        }
      } catch (e) {}

      setTimeout(go, 2000);
    })();
  </script>
</body>
</html>
